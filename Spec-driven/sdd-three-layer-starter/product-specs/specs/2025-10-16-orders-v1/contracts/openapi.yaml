openapi: 3.0.3
info:
  title: Orders API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /api/orders:
    get:
      summary: List orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      required: [id, item, qty]
      properties:
        id: { type: string }
        item: { type: string }
        qty: { type: integer, minimum: 1 }
    NewOrder:
      type: object
      required: [item, qty]
      properties:
        item: { type: string }
        qty: { type: integer, minimum: 1 }
